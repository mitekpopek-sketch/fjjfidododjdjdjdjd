<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Danych</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Generator mDowodu</h2>
  <form id="genForm">
    <input type="text" id="name" placeholder="Imię" value="JAN" required>
    <input type="text" id="surname" placeholder="Nazwisko" value="KOWALSKI" required>
    <input type="text" id="pesel" placeholder="PESEL" value="90010112345" required>
    <input type="text" id="birthday" placeholder="Data urodzenia (np. 01.01.1990)" value="01.01.1990" required>
    <button type="submit">Zapisz i Przejdź do Dowodu</button>
  </form>

  <script>
    document.getElementById('genForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = {
        name: document.getElementById('name').value,
        surname: document.getElementById('surname').value,
        pesel: document.getElementById('pesel').value,
        birthday: document.getElementById('birthday').value,
        nationality: "POLSKIE",
        sex: "Mężczyzna"
      };
      
      // Zapis do pamięci przeglądarki
      localStorage.setItem('formData', JSON.stringify(data));
      localStorage.setItem('cardData', JSON.stringify(data));
      Object.keys(data).forEach(k => localStorage.setItem(k, data[k]));

      alert("Dane zapisane!");
      window.location.href = "card.html";
    });
  </script>
</body>
</html>
